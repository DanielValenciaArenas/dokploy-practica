version: '3.8'

services:
  # Aplicación de ejemplo
  app:
    image: node:20-alpine
    container_name: compose-webapp
    command: sh -c "mkdir -p /app/data && node -e \"const http=require('http'); http.createServer((q,s)=>s.end('App Compose Running')).listen(3000); console.log('Server running');\""
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - compose-net
    restart: unless-stopped

  # Base de datos MongoDB
  mongodb:
    image: mongo:7
    container_name: compose-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_compose
      MONGO_INITDB_ROOT_PASSWORD: mongo_compose_2026
      MONGO_INITDB_DATABASE: compose_db
    volumes:
      - mongo-data:/data/db
    networks:
      - compose-net
    restart: unless-stopped

  # PHPMyAdmin para gestión de MySQL
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: compose-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db-service
      PMA_PORT: 3306
    depends_on:
      - db-service
    networks:
      - compose-net
    restart: unless-stopped

  # Base de datos MySQL
  db-service:
    image: mysql:8.0
    container_name: compose-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_compose_2026
      MYSQL_DATABASE: compose_db
      MYSQL_USER: admin_compose
      MYSQL_PASSWORD: compose_pass_2026
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - compose-net
    restart: unless-stopped

volumes:
  mongo-data:
  mysql-data:

networks:
  compose-net:
    driver: bridge
